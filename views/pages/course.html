<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course - Kembangin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../public/css/course.css">
<link rel="stylesheet" href="../public/css/component.css" />
</head>
<body data-page="course">

<site-navbar></site-navbar>

<main id="main">

  <!-- ======================================================= -->
  <!-- ===============  VIEW: DAFTAR MATERI  ================== -->
  <!-- ======================================================= -->
  <div class="view" id="view-list">

    <section class="wrap course-header reveal">
      <div class="course-header__top">
        <div>
          <span class="badge">COURSE</span>
          <h1 id="course-title"></h1>
          <div class="course-header__meta" id="course-meta"></div>
        </div>
        <div class="course-header__progress">
          <div class="progress-bar"><div class="progress-fill" id="header-progress-fill"></div></div>
          <p class="progress-label" id="header-progress-label"></p>
          <button class="btn course-header__resume" id="resume-btn"></button>
        </div>
      </div>
      <div class="course-header__done-banner" id="done-banner" hidden>
        <i class="fa-solid fa-trophy"></i>
        <span>Kamu telah menyelesaikan seluruh materi course ini. Kerja bagus!</span>
      </div>

      <div class="roadmap-section">
        <p class="roadmap-section__title"><i class="fa-solid fa-road"></i> Roadmap Belajar</p>
        <div class="roadmap-track" id="roadmap-track"></div>
      </div>

      <div class="analytics-section">
        <p class="analytics-section__title"><i class="fa-solid fa-chart-simple"></i> Analisis Progres Belajar</p>
        <div class="an-card-grid" id="analytics-cards"></div>
        <div class="an-bars" id="analytics-bars"></div>
      </div>
    </section>

    <section class="wrap section">
      <div id="materi-list">
        <p class="state-msg"><i class="fa-solid fa-spinner fa-spin"></i> Memuat materi course...</p>
      </div>
    </section>

  </div>

  <!-- ======================================================= -->
  <!-- ==================  VIEW: PLAYER  ======================= -->
  <!-- ======================================================= -->
  <div class="view" id="view-player" hidden>
    <section class="wrap section player-main">
      <button class="back-link" id="back-to-list"><i class="fa-solid fa-arrow-left"></i> Kembali ke Daftar Materi</button>

      <p class="lesson-count" id="lesson-count">Materi 1 dari 18</p>
      <div class="thumb" id="lesson-thumb">
        <i class="fa-solid fa-play thumb-ic"></i>
        <img src="" alt="" loading="lazy" onerror="this.classList.add('broken')">
      </div>
      <h1 id="lesson-title"></h1>
      <p class="lesson-desc" id="lesson-desc"></p>

      <div class="lesson-actions">
        <button class="btn" id="btn-complete"><i class="fa-regular fa-circle-check"></i> Tandai Selesai</button>
        <button class="btn ghost" id="btn-bookmark"><i class="fa-regular fa-bookmark"></i> Bookmark</button>
        <button class="btn ghost" id="btn-notes"><i class="fa-regular fa-note-sticky"></i> Catatan</button>
      </div>

      <div class="notes-panel" id="notes-panel" hidden>
        <textarea id="notes-text" rows="4" maxlength="600" placeholder="Tulis catatanmu untuk materi ini..."></textarea>
        <button class="btn" id="notes-save">Simpan Catatan</button>
        <span class="notes-saved" id="notes-saved" hidden><i class="fa-solid fa-check"></i> Catatan tersimpan</span>
      </div>

      <div class="quiz-box" id="quiz-box" hidden></div>

      <div class="lesson-nav">
        <button class="btn ghost" id="lesson-prev"><i class="fa-solid fa-arrow-left"></i> Sebelumnya</button>
        <button class="btn" id="lesson-next">Berikutnya <i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </section>
  </div>

</main>

<div class="toast" id="toast" hidden></div>

<!-- ============ KEMBA AI (prototipe tampilan, belum terhubung ke model AI) ============ -->
<button class="ai-fab" id="ai-fab" aria-label="Buka Kemba AI"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
<div class="ai-panel" id="ai-panel" hidden>
  <div class="ai-head">
    <span><i class="fa-solid fa-wand-magic-sparkles"></i> Kemba AI <small>Prototipe</small></span>
    <button id="ai-close" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="ai-body" id="ai-body"></div>
  <form class="ai-input-row" id="ai-form">
    <input id="ai-input" placeholder="Tanya seputar fitur di halaman ini..." autocomplete="off">
    <button type="submit" aria-label="Kirim"><i class="fa-solid fa-paper-plane"></i></button>
  </form>
</div>

<site-footer></site-footer>
<!-- script -->
<script src="../public/js/auth.js"></script>
<script src="../components/Navbar.js"></script>
<script src="../components/Footer.js"></script>
<script src="../public/js/component.js"></script>
<script src="../public/js/search.js"></script>
<script src="../public/js/course.js"></script>
</body>
</html>
