<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kembangin</title>
    <link rel="stylesheet" href="../public/css/component.css">
    <link rel="stylesheet" href="../public/css/article.css">
    <link rel="stylesheet" href="../public/css/artikel-plus.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body data-page="article">

  <site-navbar></site-navbar>
  <main>
    <div class="left-side">
      <div class="filter-artikel">
        <div class="search-artikel">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Cari artikel..." aria-label="Cari artikel">
        </div>
        <div class="filter-btn">
          <select name="urutan" id="filter-urutan" aria-label="Urutkan berdasarkan tanggal">
            <option value="newest">Terbaru</option>
            <option value="oldest">Terlama</option>
          </select>
          <select name="nama" id="filter-nama" aria-label="Urutkan berdasarkan nama">
            <option value="az">Nama A - Z</option>
            <option value="za">Nama Z - A</option>
          </select>
          <select name="populer" id="filter-populer" aria-label="Urutkan berdasarkan popularitas">
            <option value="popular">Paling Populer</option>
            <option value="most-viewed">Paling Banyak Dilihat</option>
          </select>
        </div>
      </div>

      <!-- Diisi artikel.js: chip kategori -->
      <div class="kategori-artikel" role="group" aria-label="Filter kategori"></div>

      <!-- Jumlah hasil + tombol reset filter (tampil saat ada filter aktif) -->
      <div class="hasil-artikel">
        <p class="hasil-info" aria-live="polite"></p>
        <button type="button" class="btn-reset" data-act="reset" hidden><i class="fa-solid fa-rotate-left"></i> Reset filter</button>
      </div>

      <!-- Diisi artikel.js: artikel unggulan (hanya di tampilan awal) -->
      <div class="featured-slot"></div>

      <!-- Diisi artikel.js dari database/artikel.json (kartu .card-artikel) -->
      <div class="card-container"></div>

      <!-- Tombol muat lebih banyak (pengganti pagination angka) -->
      <div class="loadmore-wrap">
        <button type="button" class="btn-loadmore" data-act="more" hidden>Muat lebih banyak <small></small></button>
      </div>
    </div>

    <div class="right">
      <div class="sidebar-section">
        <h3 class="sidebar-title">Artikel Populer</h3>
        <!-- Diisi artikel.js: artikel dengan like terbanyak (.popular-card) -->
        <div class="popular-scroll"></div>
      </div>
      <div class="sidebar-section">
        <h3 class="sidebar-title">Rekomendasi Artikel</h3>
        <!-- Diisi artikel.js: artikel unggulan (featured) acak (.sidebar-item) -->
        <ul class="sidebar-list"></ul>
      </div>
    </div>
  </main>

    <!-- script -->
    <script src="../components/Navbar.js"></script>
    <script src="../public/js/component.js"></script>
    <script src="../public/js/artikel.js"></script>
    <!-- script end-->
</body>
</html>
