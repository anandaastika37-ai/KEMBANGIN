<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../public/css/register.css">
</head>
<body>
    <section>
        <div class="container">
            <h2>Register</h2>

            <!-- Dibungkus dengan tag form -->
            <form action="#">
                <div class="form-grid">
                    <div class="input-box">
                        <label for="full_name">Full Name</label>
                        <input type="text" id="full_name" placeholder="Full name" required>
                    </div>

                    <div class="input-box">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Username" required>
                    </div>

                    <div class="input-box">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="Phone Number" required>
                    </div>

                    <div class="input-box">
                        <label for="age">Age</label>
                        <input type="number" id="age" placeholder="Age" required>
                    </div>

                    <div class="input-box">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Email Address" required>
                    </div>

                    <div class="input-box">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter password" required>
                    </div>

                    <div class="input-box">
                        <label for="address">Address</label>
                        <input type="text" id="address" placeholder="Address" required>
                    </div>

                    <div class="input-box">
                        <label for="gender">Gender</label>
                        <select name="gender" id="gender" required>
                            <option value="" disabled selected hidden>Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>

                    <div class="input-box">
                        <label for="business_name">Business Name</label>
                        <input type="text" id="business_name" placeholder="Business Name" required>
                    </div>

                    <div class="input-box">
                        <label for="tax_id">Tax ID Number</label>
                        <input type="text" id="tax_id" placeholder="Tax ID Number (NPWP)" required>
                    </div>

                    <div class="input-box">
                        <label for="business_category">Business Category</label>
                        <select name="business_category" id="business_category" required>
                            <option value="" disabled selected hidden>Select Category</option>
                            <option value="food">Food</option>
                            <option value="fashion">Fashion</option>
                            <option value="electronics">Electronics</option>
                            <option value="health">Health</option>
                            <option value="beauty">Beauty</option>
                            <option value="sports">Sports</option>
                            <option value="home">Home & Living</option>
                            <option value="automotive">Automotive</option>
                            <option value="entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="input-box">
                        <label for="year_established">Year Established</label>
                        <input type="number" id="year_established" placeholder="Year" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Submit</button>
            </form>
        </div>
    </section>
</body>
</html>
